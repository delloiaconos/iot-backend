# Loaded inside the http block by the official Nginx image.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The certificate must cover the server names used in the current environment,
# including grafana.localhost and influxdb.localhost for local development.
ssl_certificate /etc/nginx/certs/fullchain.pem;
ssl_certificate_key /etc/nginx/certs/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
