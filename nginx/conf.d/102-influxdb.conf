server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name influx.example.com influxdb.localhost;

    # Allow batched writes and CSV imports larger than Nginx's default 1 MiB.
    client_max_body_size 50m;

    location / {
        proxy_pass http://influxdb_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";

        # Stream query results and allow time for longer queries and imports.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
